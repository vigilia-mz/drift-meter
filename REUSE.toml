# Machine-readable licensing, per the REUSE specification.
#
# This repository holds two kinds of thing and licenses them differently.
#
# Apache-2.0 covers the code. CC BY 4.0 covers the prose: the three essay pages,
# every word of screen copy, the system prompts, and the two documents that are
# part of the artifact rather than notes about it (CHANGELOG.md, SOURCES.md).
#
# Applying a software licence to six thousand words of essay is semantically
# incoherent — the patent grant, the Source/Object distinction and the NOTICE
# mechanics have no referent in prose — and it signals "this is software" to
# exactly the readers the essays are written for.
#
# CC BY rather than BY-SA or BY-NC, deliberately: share-alike would discourage
# quotation in differently-licensed publications, and "non-commercial" would
# block academic and commercial republication alike. Plain BY asks for
# attribution and nothing else, which is the right ask from an author who takes
# sole responsibility for every claim.
#
# The third block is the repository's own documentation, and it exists because
# the two principles above disagree about it. CLAUDE.md, CONTRIBUTING.md,
# SECURITY.md and docs/ are prose, so a software licence is as incoherent for
# them as it is for the essays — and they are notes about the artifact rather
# than part of it, which is the distinction that puts CHANGELOG.md and SOURCES.md
# in the first block. They are listed separately at the same licence so that both
# things stay visible: same terms, different standing, and nothing quietly
# re-filed as the artifact to make a glob shorter.
#
# `scripts/check-licensing.mjs` asserts that every tracked file is covered here
# and that every licence named here has its text in LICENSES/. This file used to
# be checked by reading it, and under that arrangement two of the three licence
# texts were missing and six files were covered by nothing — including a docs/
# page added in the same version as this comment.

version = 1
SPDX-PackageName = "The Drift Meter"
SPDX-PackageSupplier = "Megi Pishtari <https://github.com/vigilia-mz>"
SPDX-PackageDownloadLocation = "https://github.com/vigilia-mz/drift-meter"

# --- Prose: the artifact -----------------------------------------------------

[[annotations]]
path = [
  "index.html",
  "essay.html",
  "atrophy.html",
  "src/content/**",
  "src/prompts/**",
  "shared/teach.ts",
  "CHANGELOG.md",
  "SOURCES.md",
  "README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Megi Pishtari"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Prose: notes about the artifact -----------------------------------------

[[annotations]]
path = [
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Megi Pishtari"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Code --------------------------------------------------------------------
#
# drift-meter.html is here rather than with the essay pages because it mounts the
# app and carries no content of its own. The config files are here because they
# are not prose, which is the only distinction this file makes.

[[annotations]]
path = [
  "src/**",
  "shared/**",
  "api/**",
  "scripts/**",
  "tests/**",
  "public/favicon.svg",
  "drift-meter.html",
  "*.json",
  "*.ts",
  "*.js",
  "*.mjs",
  "*.yml",
  "*.toml",
  ".github/**",
  ".editorconfig",
  ".env",
  ".gitattributes",
  ".gitignore",
  ".nvmrc",
  ".prettierignore",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Megi Pishtari"
SPDX-License-Identifier = "Apache-2.0"

# --- Third-party fonts -------------------------------------------------------
#
# Newsreader and IBM Plex ship under the SIL Open Font License. They are
# self-hosted rather than loaded from a third party, because the consent screen
# promises that nothing leaves the browser and a CDN font request would make that
# false on every page load.

[[annotations]]
path = ["public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC; IBM Corporation"
SPDX-License-Identifier = "OFL-1.1"
