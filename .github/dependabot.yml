version: 2

updates:
  # The repository requires actions to be pinned to a full commit SHA. Pinning
  # without automated bumps rots into old actions with known vulnerabilities, so
  # this ecosystem is load-bearing rather than optional: Dependabot understands
  # SHA pins and updates them, keeping the readable version in a trailing comment.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint declares a peer range of >=4.8.4 <6.1.0. Taking
      # TypeScript 7 would mean linting without type information, which would
      # disable the four rules that encode CLAUDE.md: the model-pin confinement,
      # the Math.random ban, the API-key ban, and no-magic-numbers on the derived
      # measures. Those are worth more than a newer compiler.
      #
      # Remove this entry when typescript-eslint widens its peer range, and take
      # both packages up together.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
