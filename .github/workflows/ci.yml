name: CI

on:
  pull_request:
  push:
    branches: [main]

# The repository default is read-only. This job needs nothing more, and says so
# rather than inheriting silently.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs because the repository requires
      # it. Dependabot keeps them current; see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # CLAUDE.md hard rule 1: the previous build's central defect was an
      # 894 KB committed bundle. This is that lesson as a check.
      - name: Size budget
        run: npm run check:size
